plugins {
    id "com.android.application"
}

android {
    namespace "online.nebulavm.app"
    compileSdk 35

    signingConfigs {
        release {
            def keystorePath = System.getenv("NEBULAVM_ANDROID_KEYSTORE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("NEBULAVM_ANDROID_KEYSTORE_PASSWORD")
                keyAlias "nebulavm"
                keyPassword System.getenv("NEBULAVM_ANDROID_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "online.nebulavm.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
