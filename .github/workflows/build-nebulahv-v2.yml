name: Build NebulaHV V2 runtime

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-nebulahv-v2.yml"
      - "runtime/nebulahv-v2/**"

permissions:
  contents: read

jobs:
  qemu-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned qemu-wasm source
        run: |
          git clone --filter=blob:none https://github.com/ktock/qemu-wasm.git qemu-wasm
          git -C qemu-wasm checkout 0ef7b4e2814b231705d8371dd7997f5b72e70baf
          git -C qemu-wasm apply "$GITHUB_WORKSPACE/runtime/nebulahv-v2/qemu-nebulahv-display.patch"
      - name: Build toolchain image
        working-directory: qemu-wasm
        run: docker build -t nebulahv-qemu-builder - < Dockerfile
      - name: Compile graphical x86-64 runtime
        run: |
          docker run --rm -d --name nebulahv-qemu-builder \
            -v "$GITHUB_WORKSPACE/qemu-wasm:/qemu:ro" \
            -v "$GITHUB_WORKSPACE/runtime/nebulahv-v2:/nebulahv:ro" \
            nebulahv-qemu-builder
          EXTRA_CFLAGS="-O3 -Wno-error=unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sFORCE_FILESYSTEM -sWASMFS=1 -lopfs.js -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc --js-library=/build/node_modules/xterm-pty/emscripten-pty.js --js-library=/nebulahv/nebulahv-library.js -sEXPORT_ES6=1 -sASYNCIFY_IMPORTS=ffi_call_js"
          docker exec nebulahv-qemu-builder emconfigure /qemu/configure \
            --static --target-list=x86_64-softmmu --cpu=wasm32 --cross-prefix= \
            --without-default-features --enable-system --enable-pixman \
            --with-coroutine=fiber --enable-virtfs \
            --extra-cflags="$EXTRA_CFLAGS" \
            --extra-cxxflags="$EXTRA_CFLAGS" \
            --extra-ldflags="-sEXPORTED_FUNCTIONS=_main,_nebulahv_pointer_move,_nebulahv_pointer_button,_nebulahv_pointer_wheel,_nebulahv_key_number -sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS"
          docker exec nebulahv-qemu-builder emmake make -j 2 qemu-system-x86_64
      - name: Collect and inspect runtime
        run: |
          mkdir -p nebulahv-runtime
          docker cp nebulahv-qemu-builder:/build/qemu-system-x86_64 nebulahv-runtime/out.js
          docker cp nebulahv-qemu-builder:/build/qemu-system-x86_64.wasm nebulahv-runtime/qemu-system-x86_64.wasm
          docker cp nebulahv-qemu-builder:/build/qemu-system-x86_64.worker.js nebulahv-runtime/qemu-system-x86_64.worker.js
          grep -q "nebulahv" nebulahv-runtime/out.js
          test -s nebulahv-runtime/qemu-system-x86_64.wasm
          sha256sum nebulahv-runtime/* > nebulahv-runtime/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nebulahv-v2-graphics-${{ github.sha }}
          path: nebulahv-runtime/
          if-no-files-found: error
          retention-days: 14
