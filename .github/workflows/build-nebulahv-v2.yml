name: Build NebulaHV V2 runtime

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-nebulahv-v2.yml"
      - "runtime/nebulahv-v2/**"

permissions:
  contents: read

jobs:
  qemu-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned qemu-wasm source
        run: |
          git clone --filter=blob:none https://github.com/ktock/qemu-wasm.git qemu-wasm
          git -C qemu-wasm checkout 0ef7b4e2814b231705d8371dd7997f5b72e70baf
          git -C qemu-wasm apply "$GITHUB_WORKSPACE/runtime/nebulahv-v2/qemu-nebulahv-display.patch"
          git clone --depth 1 https://gitlab.com/qemu-project/dtc.git qemu-wasm/subprojects/dtc
          git -C qemu-wasm/subprojects/dtc fetch --depth 1 origin b6910bec11614980a21e46fbccc35934b671bd81
          git -C qemu-wasm/subprojects/dtc checkout FETCH_HEAD
          git clone --depth 1 https://gitlab.com/qemu-project/keycodemapdb.git qemu-wasm/subprojects/keycodemapdb
          git -C qemu-wasm/subprojects/keycodemapdb fetch --depth 1 origin f5772a62ec52591ff6870b7e8ef32482371f22c6
          git -C qemu-wasm/subprojects/keycodemapdb checkout FETCH_HEAD
          git clone --depth 1 https://gitlab.com/qemu-project/berkeley-softfloat-3.git qemu-wasm/subprojects/berkeley-softfloat-3
          git -C qemu-wasm/subprojects/berkeley-softfloat-3 fetch --depth 1 origin b64af41c3276f97f0e181920400ee056b9c88037
          git -C qemu-wasm/subprojects/berkeley-softfloat-3 checkout FETCH_HEAD
          cp -a qemu-wasm/subprojects/packagefiles/berkeley-softfloat-3/. qemu-wasm/subprojects/berkeley-softfloat-3/
          git clone --depth 1 https://gitlab.com/qemu-project/berkeley-testfloat-3.git qemu-wasm/subprojects/berkeley-testfloat-3
          git -C qemu-wasm/subprojects/berkeley-testfloat-3 fetch --depth 1 origin e7af9751d9f9fd3b47911f51a5cfd08af256a9ab
          git -C qemu-wasm/subprojects/berkeley-testfloat-3 checkout FETCH_HEAD
          cp -a qemu-wasm/subprojects/packagefiles/berkeley-testfloat-3/. qemu-wasm/subprojects/berkeley-testfloat-3/
          sed -i 's#https://zlib.net/zlib-\$ZLIB_VERSION.tar.xz#https://github.com/madler/zlib/releases/download/v\$ZLIB_VERSION/zlib-\$ZLIB_VERSION.tar.xz#' qemu-wasm/Dockerfile
      - name: Restore toolchain image
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nebulahv-qemu-builder.tar
          key: nebulahv-qemu-builder-ubuntu24-emscripten-3.1.50-v1
      - name: Build toolchain image
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: qemu-wasm
        run: |
          docker build -t nebulahv-qemu-builder - < Dockerfile
          docker save nebulahv-qemu-builder -o /tmp/nebulahv-qemu-builder.tar
      - name: Save toolchain image
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/nebulahv-qemu-builder.tar
          key: nebulahv-qemu-builder-ubuntu24-emscripten-3.1.50-v1
      - name: Load toolchain image
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/nebulahv-qemu-builder.tar
      - name: Compile graphical x86-64 runtime
        run: |
          docker run --rm -d --name nebulahv-qemu-builder \
            -v "$GITHUB_WORKSPACE/qemu-wasm:/qemu:ro" \
            -v "$GITHUB_WORKSPACE/runtime/nebulahv-v2:/nebulahv:ro" \
            nebulahv-qemu-builder
          EXTRA_CFLAGS="-O3 -Wno-error=unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE -pthread"
          docker exec nebulahv-qemu-builder emcc $EXTRA_CFLAGS -c /nebulahv/nebulahv-fcntl.c -o /build/nebulahv-fcntl.o
          EXTRA_LDFLAGS="/build/nebulahv-fcntl.o -Wl,--wrap=fcntl -pthread -sASYNCIFY=1 -sPROXY_TO_PTHREAD=1 -sFORCE_FILESYSTEM -sWASMFS=1 -lopfs.js -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc --js-library=/nebulahv/nebulahv-library.js -sEXPORT_ES6=1 -sASYNCIFY_IMPORTS=ffi_call_js -sEXPORTED_FUNCTIONS=_main,_nebulahv_pointer_move,_nebulahv_pointer_button,_nebulahv_pointer_wheel,_nebulahv_key_number -sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,FS,callMain"
          docker exec nebulahv-qemu-builder emconfigure /qemu/configure \
            --static --target-list=x86_64-softmmu --cpu=wasm32 --cross-prefix= \
            --without-default-features --enable-system --enable-pixman \
            --with-coroutine=fiber --enable-virtfs \
            --extra-cflags="$EXTRA_CFLAGS" \
            --extra-cxxflags="$EXTRA_CFLAGS" \
            --extra-ldflags="$EXTRA_LDFLAGS"
          docker exec nebulahv-qemu-builder emmake make -j 2 qemu-system-x86_64
      - name: Collect and inspect runtime
        run: |
          mkdir -p nebulahv-runtime
          docker cp nebulahv-qemu-builder:/build/qemu-system-x86_64 nebulahv-runtime/out.js
          docker cp nebulahv-qemu-builder:/build/qemu-system-x86_64.wasm nebulahv-runtime/qemu-system-x86_64.wasm
          docker cp nebulahv-qemu-builder:/build/qemu-system-x86_64.worker.js nebulahv-runtime/qemu-system-x86_64.worker.js
          grep -q "nebulahv" nebulahv-runtime/out.js
          test -s nebulahv-runtime/qemu-system-x86_64.wasm
          sha256sum nebulahv-runtime/* > nebulahv-runtime/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nebulahv-v2-graphics-${{ github.sha }}
          path: nebulahv-runtime/
          if-no-files-found: error
          retention-days: 14
